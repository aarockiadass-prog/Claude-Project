name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check page structure and script syntax
        run: |
          test -f index.html
          grep -q "<title>" index.html
          ! grep -nE "localStorage|sessionStorage|indexedDB|document\.cookie" index.html
          python3 - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "no inline script found"
          open("page.js", "w", encoding="utf-8").write("\n".join(scripts))
          PY
          node --check page.js
          node --check .claude/hooks/roadmap-popup.js

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir -p _site/hooks
          cp .claude/hooks/roadmap-popup.js _site/hooks/
          # Pages artifacts drop dot-folders, so serve the hook from /hooks/
          sed 's#\.claude/hooks/#hooks/#' index.html > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
