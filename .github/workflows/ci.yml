name: CI/CD

on:
  push:
    branches: [claude/new-session-4yacjx, claude/affectionate-mccarthy-mzl3eh, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check page structure and script syntax
        run: |
          test -f index.html
          test -f v2/index.html
          grep -q "<title>" index.html
          ! grep -nE "localStorage|sessionStorage|indexedDB|document\.cookie" index.html v2/index.html
          python3 - <<'PY'
          import re
          for name, path in (("page.js", "index.html"), ("page-v2.js", "v2/index.html")):
              html = open(path, encoding="utf-8").read()
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              assert scripts, "no inline script found in " + path
              open(name, "w", encoding="utf-8").write("\n".join(scripts))
          PY
          node --check page.js
          node --check page-v2.js

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'claude/new-session-4yacjx' || github.ref_name == 'claude/affectionate-mccarthy-mzl3eh')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir -p _site/v2
          cp index.html _site/
          cp v2/index.html _site/v2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
